name: Sync and validate title fork

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-title-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'alcxyz/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # checkout's credential cleanup recursively inspects every gitlink, but
      # vendored repositories under .repos contain gitlinks not owned by the
      # root .gitmodules. Fetch directly so credentials stay ephemeral without
      # invoking that submodule cleanup path.
      - name: Check out title fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/fork-sync-checkout.gitconfig"
          : > "$GIT_CONFIG_GLOBAL"
          gh auth setup-git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --no-recurse-submodules --filter=blob:none origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/automatic-thread-titles:refs/remotes/origin/feat/automatic-thread-titles'
          git checkout --force -B feat/automatic-thread-titles \
            refs/remotes/origin/feat/automatic-thread-titles

      - name: Test sync safeguards
        run: python3 .github/scripts/test-fork-sync.py

      - name: Prepare upstream merge
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VALIDATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          bash .github/scripts/fork-sync.sh prepare

      - name: Set up Vite+
        if: steps.prepare.outputs.validate == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install native build libraries
        if: steps.prepare.outputs.validate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config ripgrep

      - name: Validate source and desktop build
        if: steps.prepare.outputs.validate == 'true'
        run: bash .github/scripts/validate-title-fork.sh

      - name: Publish validated feature branch
        if: steps.prepare.outputs.validate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FEATURE_HEAD: ${{ steps.prepare.outputs.feature_head }}
        run: bash .github/scripts/fork-sync.sh publish

      - name: Report blocked sync
        if: failure()
        run: |
          echo 'Fork sync failed. Review the merge or validation logs before retrying.' >> "$GITHUB_STEP_SUMMARY"
